<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: transparent; overflow: hidden; }
  .live-mic-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 12px;
    padding: 6px 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  }
  .mic-btn {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: #ffffff;
    border: none;
    border-radius: 30px;
    padding: 9px 22px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 14px rgba(2, 132, 199, 0.4);
    transition: all 0.2s ease;
    white-space: nowrap;
    user-select: none;
  }
  .mic-btn:hover {
    background: linear-gradient(135deg, #0369a1, #075985);
    transform: translateY(-1px);
    box-shadow: 0 0 20px rgba(2, 132, 199, 0.6);
  }
  .mic-btn.active {
    background: linear-gradient(135deg, #ef4444, #dc2626) !important;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }
  .status-text {
    font-size: 0.9rem;
    color: #94a3b8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
</style>
</head>
<body>
  <div class="live-mic-wrap">
    <button id="micBtn" class="mic-btn" onclick="toggleListening()">
      <span id="micIcon">🎙️</span>
      <span id="btnText">Live Microphone (Click & Speak)</span>
    </button>
    <div id="statusText" class="status-text">Click to speak in English or Hindi</div>
  </div>

<script>
  let isListening = false;
  let recognition = null;
  let targetLang = "en-US";
  let defaultBtnLabel = "Live Microphone (Click & Speak)";
  let defaultHelpText = "Click to speak in English or Hindi";

  function sendToStreamlit(type, data) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: type,
      ...data
    }, "*");
  }

  // Notify Streamlit component is ready
  sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
  sendToStreamlit("streamlit:setFrameHeight", { height: 56 });

  // Handle render event from Streamlit Python
  window.addEventListener("message", function(event) {
    if (event.data && event.data.type === "streamlit:render") {
      const args = event.data.args || {};
      if (args.language) {
        targetLang = args.language;
      }
      if (args.btn_label) {
        defaultBtnLabel = args.btn_label;
        if (!isListening) {
          document.getElementById("btnText").innerText = defaultBtnLabel;
        }
      }
      if (args.help_text) {
        defaultHelpText = args.help_text;
        if (!isListening) {
          document.getElementById("statusText").innerText = defaultHelpText;
        }
      }
      sendToStreamlit("streamlit:setFrameHeight", { height: 56 });
    }
  });

  function toggleListening() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || window.parent.SpeechRecognition || window.parent.webkitSpeechRecognition;
    const btn = document.getElementById("micBtn");
    const btnText = document.getElementById("btnText");
    const status = document.getElementById("statusText");

    if (!SpeechRec) {
      status.innerHTML = "<span style='color:#ef4444;'>⚠️ Web Speech API not supported in this browser. Please use Chrome or Edge.</span>";
      return;
    }

    if (isListening && recognition) {
      try { recognition.stop(); } catch(e) {}
      return;
    }

    try {
      recognition = new SpeechRec();
      recognition.lang = targetLang;
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = function() {
        isListening = true;
        btn.classList.add("active");
        btnText.innerText = "🔴 Listening... Speak now!";
        status.innerHTML = "<span style='color:#38bdf8; font-weight:600;'>🔴 Listening live... Speak now!</span>";
      };

      recognition.onresult = function(event) {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        const current = (final || interim).trim();
        if (current) {
          status.innerHTML = "<span style='color:#10b981; font-weight:700;'>🗣️ " + current + "</span>";
        }
        if (final) {
          const finalClean = final.trim();
          status.innerHTML = "<span style='color:#10b981; font-weight:700;'>✅ Captured: " + finalClean + " — Searching...</span>";
          btn.classList.remove("active");
          btnText.innerText = defaultBtnLabel;
          isListening = false;
          // Send recognized text back to Streamlit Python with timestamp!
          sendToStreamlit("streamlit:setComponentValue", {
            value: { text: finalClean, ts: Date.now() }
          });
        }
      };

      recognition.onerror = function(event) {
        isListening = false;
        btn.classList.remove("active");
        btnText.innerText = defaultBtnLabel;
        if (event.error !== 'no-speech') {
          status.innerHTML = "<span style='color:#ef4444;'>Mic notice: " + event.error + ". Click to retry.</span>";
        } else {
          status.innerHTML = "<span style='color:#94a3b8;'>No speech detected. Click mic to speak again.</span>";
        }
      };

      recognition.onend = function() {
        isListening = false;
        btn.classList.remove("active");
        btnText.innerText = defaultBtnLabel;
      };

      recognition.start();
    } catch (err) {
      status.innerHTML = "<span style='color:#ef4444;'>Mic error: " + err.message + "</span>";
    }
  }
</script>
</body>
</html>
